services:
  wallapop-sniper:
    build: .
    image: boti-sniper:v4.1
    container_name: wallapop-sniper
    restart: unless-stopped
    command: ["python", "-u", "sniper.py"]
    env_file:
      - .env
    environment:
      - SCAN_INTERVAL_SECONDS=8
      - TZ=Europe/Madrid
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./data:/app/data
      - ./kits:/app/kits
      - ./config.json:/app/config.json:ro
      - ./antiban.py:/app/antiban.py:ro
      - ./core_engine.py:/app/core_engine.py:ro
      - ./fraud_signals.py:/app/fraud_signals.py:ro
      - ./logger.py:/app/logger.py:ro
      - ./sniper.py:/app/sniper.py:ro
      - ./bot.py:/app/bot.py:ro
      - ./healthcheck.py:/app/healthcheck.py:ro
      - ./tools:/app/tools:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  vinted-sniper:
    image: boti-sniper:v4.1
    container_name: vinted-sniper
    restart: unless-stopped
    command: ["python", "-u", "vinted_sniper.py"]
    env_file:
      - .env
    environment:
      - VINTED_SCAN_INTERVAL_SECONDS=45
      - TZ=Europe/Madrid
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./data:/app/data
      - ./kits:/app/kits
      - ./config.json:/app/config.json:ro
      - ./antiban.py:/app/antiban.py:ro
      - ./core_engine.py:/app/core_engine.py:ro
      - ./fraud_signals.py:/app/fraud_signals.py:ro
      - ./logger.py:/app/logger.py:ro
      - ./vinted_sniper.py:/app/vinted_sniper.py:ro
      - ./healthcheck.py:/app/healthcheck.py:ro
      - ./tools:/app/tools:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  multi-sniper:
    image: boti-sniper:v4.1
    container_name: multi-sniper
    restart: unless-stopped
    command: ["python", "-u", "multi_sniper.py"]
    env_file:
      - .env
    environment:
      - MULTI_SCAN_INTERVAL_SECONDS=45
      - TZ=Europe/Madrid
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./data:/app/data
      - ./kits:/app/kits
      - ./config.json:/app/config.json:ro
      - ./antiban.py:/app/antiban.py:ro
      - ./core_engine.py:/app/core_engine.py:ro
      - ./fraud_signals.py:/app/fraud_signals.py:ro
      - ./logger.py:/app/logger.py:ro
      - ./multi_sniper.py:/app/multi_sniper.py:ro
      - ./healthcheck.py:/app/healthcheck.py:ro
      - ./tools:/app/tools:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  relister-bot:
    image: boti-sniper:v4.1
    container_name: relister-bot
    restart: unless-stopped
    command: ["python", "-u", "bot.py"]
    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    volumes:
      - ./data:/app/data
      - ./kits:/app/kits
      - ./config.json:/app/config.json
      - ./antiban.py:/app/antiban.py:ro
      - ./core_engine.py:/app/core_engine.py:ro
      - ./fraud_signals.py:/app/fraud_signals.py:ro
      - ./logger.py:/app/logger.py:ro
      - ./bot.py:/app/bot.py:ro
      - ./healthcheck.py:/app/healthcheck.py:ro
      - ./tools:/app/tools:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
